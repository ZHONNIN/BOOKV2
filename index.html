<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D Book</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const BOOK_WIDTH = 2.0;
        const BOOK_HEIGHT = 3.0;
        const PAGE_THICKNESS = 0.02;
        const TOTAL_PAGES = 8;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a2a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        const bookGroup = new THREE.Group();
        scene.add(bookGroup);

        const pages = [];

        for (let i = 0; i < TOTAL_PAGES; i++) {
            const pivot = new THREE.Group();
            pivot.position.x = -BOOK_WIDTH / 2;

            const pageGeo = new THREE.BoxGeometry(BOOK_WIDTH, BOOK_HEIGHT, PAGE_THICKNESS);

            let pageMat;
            if (i === 0) {
                pageMat = new THREE.MeshStandardMaterial({
                    color: 0x8b4513,
                    side: THREE.DoubleSide
                });
            } else if (i === TOTAL_PAGES - 1) {
                pageMat = new THREE.MeshStandardMaterial({
                    color: 0x654321,
                    side: THREE.DoubleSide
                });
            } else {
                pageMat = new THREE.MeshStandardMaterial({
                    color: 0xf5f5dc,
                    side: THREE.DoubleSide
                });
            }

            const pageMesh = new THREE.Mesh(pageGeo, pageMat);
            pageMesh.position.set(BOOK_WIDTH / 2, 0, 0);

            pivot.add(pageMesh);
            bookGroup.add(pivot);

            pages.push({ pivot, mesh: pageMesh, targetRotation: 0, currentRotation: 0 });
        }

        let currentPageIndex = 0;

        class PageAnimation {
            constructor(page, targetRotation, duration, callback) {
                this.page = page;
                this.startRotation = page.currentRotation;
                this.targetRotation = targetRotation;
                this.duration = duration;
                this.elapsed = 0;
                this.callback = callback;
            }

            update(delta) {
                this.elapsed += delta;
                const progress = Math.min(this.elapsed / this.duration, 1);
                const eased = progress < 0.5
                    ? 4 * progress * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                const rotation = this.startRotation + (this.targetRotation - this.startRotation) * eased;
                this.page.pivot.rotation.y = rotation;
                this.page.currentRotation = rotation;

                if (progress >= 1) {
                    this.page.pivot.rotation.y = this.targetRotation;
                    this.page.currentRotation = this.targetRotation;
                    this.page.targetRotation = this.targetRotation;
                    if (this.callback) this.callback();
                    return true;
                }
                return false;
            }
        }

        let currentAnimation = null;
        let isAnimating = false;

        function flipForward() {
            if (isAnimating) return;
            if (currentPageIndex >= TOTAL_PAGES) return;

            isAnimating = true;
            const page = pages[currentPageIndex];

            currentAnimation = new PageAnimation(page, Math.PI, 0.8, () => {
                currentPageIndex++;
                isAnimating = false;
                currentAnimation = null;
            });
        }

        function flipBackward() {
            if (isAnimating) return;
            if (currentPageIndex <= 0) return;

            isAnimating = true;
            currentPageIndex--;
            const page = pages[currentPageIndex];

            currentAnimation = new PageAnimation(page, 0, 0.8, () => {
                isAnimating = false;
                currentAnimation = null;
            });
        }

        document.addEventListener('mousedown', (event) => {
            event.preventDefault();
            if (event.button === 0) {
                flipForward();
            } else if (event.button === 2) {
                flipBackward();
            }
        });

        document.addEventListener('contextmenu', (event) => {
            event.preventDefault();
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (currentAnimation) {
                currentAnimation.update(delta);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
